id: 864a6a9c-35e3-4b95-adf8-9c4edb4cbae5
name: hermes-install
description: >-
  Take a Linux host from unconfigured to a running Hermes, one job per method,
  each gated on the one before. The steps are placed on a worker rather than run
  locally, which is what makes the install happen on the target while the vault,
  the repository, and the swamp-club auth token stay on the orchestrator.
version: 1

# Every step in the run lands on the same worker. This is not an optimisation:
# install, configure, service, and verify all address one host's filesystem and
# one host's systemd, so a run that spread them over two workers would report
# success for a machine that was never assembled. Affinity pins the whole run to
# whichever worker the first placed step matched.
affinity: true
labels:
  role: hermes

jobs:
  - name: preflight
    description: >-
      Assert the host can take an install and validate the configuration.
      Changes nothing, so a failure here has cost only the probe.
    steps:
      - name: preflight
        task:
          type: model_method
          modelIdOrName: hermes-lima
          methodName: preflight

  - name: install
    description: >-
      Clone at the pinned commit and drive the upstream installer. This is the
      long one — Chromium, Node, and a Python toolchain.
    dependsOn:
      - job: preflight
        condition:
          type: succeeded
    steps:
      - name: install
        task:
          type: model_method
          modelIdOrName: hermes-lima
          methodName: install

  - name: configure
    description: >-
      Render the .env from the model definition. Separate from install so that
      rotating a key does not mean a reinstall.
    dependsOn:
      - job: install
        condition:
          type: succeeded
    steps:
      - name: configure
        task:
          type: model_method
          modelIdOrName: hermes-lima
          methodName: configure

  - name: service
    description: >-
      Install, enable, and start the gateway user unit. Depends on configure
      because the gateway reads the .env at startup.
    dependsOn:
      - job: configure
        condition:
          type: succeeded
    steps:
      - name: service
        task:
          type: model_method
          modelIdOrName: hermes-lima
          methodName: service

  - name: verify
    description: >-
      Confirm Hermes answers, rather than that the installer exited 0.
    dependsOn:
      - job: service
        condition:
          type: succeeded
    steps:
      - name: verify
        task:
          type: model_method
          modelIdOrName: hermes-lima
          methodName: verify
