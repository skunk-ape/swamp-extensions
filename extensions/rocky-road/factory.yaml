# Rocky Road — DRAFT, not yet validated.
#
# A @swamp/software-factory stage graph. The plan step is replaced by a
# breakdown into small sub-tickets ("chunks"); execution walks the chunks
# incrementally and can adapt the breakdown mid-flight.
#
# Usage:
#   swamp model create @swamp/software-factory chunked
#   swamp model edit chunked        # paste this under globalArguments
#   swamp model method run chunked validate
#   swamp model method run chunked describe
#   swamp model method run chunked start --input workItem=issue-42
#
# In the definition file, as a top-level sibling of globalArguments:
#   reports:
#     require:
#       - { name: "@swamp/software-factory/work-item-summary", methods: [summary] }

stages:
  - id: triage
    initial: true
    description: Classify the work item and gather context before decomposing.
    work:
      mode: interactive
      skills: [triage]
      constraints: agent-constraints/triage-conventions.md
    artifacts:
      - name: classification
        schema:
          type: object
          required: [type, confidence, reasoning]
          properties:
            type: { type: string, enum: [bug, feature, platform, security] }
            confidence: { type: string, enum: [high, medium, low] }
            reasoning: { type: string, minLength: 1 }
            isRegression: { type: boolean }
            regressionEvidence: { type: string }
    transitions:
      - name: submit
        to: breakdown
        gates:
          - type: artifact-exists
            config: { artifact: classification }

  - id: breakdown
    description: >
      Break the work into small, individually completable chunks. Re-entered
      whenever execution discovers the breakdown was wrong, which forces a
      fresh review and a fresh human approval.
    maxCycles: 8
    work:
      mode: interactive
      skills: [breakdown]
      constraints: agent-constraints/decomposition-conventions.md
    artifacts:
      - name: breakdown
        schema:
          type: object
          required: [chunks, rationale]
          properties:
            rationale: { type: string, minLength: 1 }
            chunks:
              type: array
              minItems: 1
              items:
                type: object
                required: [id, description, origin]
                properties:
                  id: { type: string, minLength: 1 }
                  description: { type: string, minLength: 1 }
                  files: { type: array, items: { type: string } }
                  dependsOn: { type: array, items: { type: string } }
                  sizeEstimate: { type: string, enum: [S, M, L] }
                  origin: { type: string, enum: [initial, split, added] }
                  parentChunk: { type: string }
                  addedReason: { type: string }
    transitions:
      - name: submit
        to: breakdown-review
        gates:
          - type: artifact-exists
            config: { artifact: breakdown }

  - id: breakdown-review
    description: Adversarial review of the seams, sizing, and ordering.
    work:
      mode: dispatch
      skills: [architecture, decomposition]
      systemPrompt: |
        You are reviewing a decomposition, not a plan. Try to refute it:
        ${{ data.latest(self.name, "artifact-breakdown").payload.rationale }}

        Attack the seams. Is any chunk too large to finish in one sitting?
        Does any chunk depend on a chunk listed after it? Are two chunks
        secretly the same change? Is there work the breakdown misses
        entirely? Record findings with severities; do not soften them.
    artifacts:
      - name: breakdown-review
        kind: findings
        reviews: breakdown
    transitions:
      - name: approve
        to: executing
        gates:
          # Forces a re-review whenever the breakdown changed — this is what
          # makes "new sub-tickets were added" impossible to slip past.
          - type: artifact-fresh
            config: { artifact: breakdown-review, recordedThisCycle: true }
          - type: findings-clear
            config: { artifact: breakdown-review, blocking: [critical, high] }
          # Cycle-scoped: an approval of breakdown v1 does not carry to v2.
          - type: human-approval
            config: { id: breakdown-approval }
      - name: rework
        to: breakdown

  - id: executing
    description: >
      Work the chunks. Agent-autonomous — the human is not involved here.
      Progress is re-recorded after each chunk, so `progress` moves
      constantly while `breakdown` stays still.
    maxCycles: 8
    maxDispatchesPerCycle: 12
    work:
      mode: interactive
      skills: [implementation]
      constraints: agent-constraints/implementation-conventions.md
    artifacts:
      - name: progress
        schema:
          type: object
          required: [chunks]
          properties:
            chunks:
              type: array
              minItems: 1
              items:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, minLength: 1 }
                  status:
                    type: string
                    enum: [pending, in_progress, done, dropped]
                  actualChanges: { type: string }
                  note: { type: string }
    transitions:
      # Material adaptation: new work discovered, a chunk must be dropped, or
      # scope changed. Goes back through review and human approval on purpose.
      - name: adapt
        to: breakdown

      - name: complete
        to: conformance-review
        gates:
          - type: cel
            config:
              expr: >
                artifacts.progress.chunks.all(c,
                  c.status == "done" || c.status == "dropped")
              message: >
                Every chunk must be done or explicitly dropped before the
                change can go to conformance review.

  - id: conformance-review
    description: >
      Compare the whole diff against the final breakdown. The adaptation
      history supplies the justifications rather than reconstructing them.
    work:
      mode: dispatch
      skills: [code-conformance]
      systemPrompt: |
        Compare the working tree against the approved breakdown. For each
        chunk, decide: implemented, deviated, partially_implemented,
        missing, or added. Anything not `implemented` needs a justification.
        The breakdown's chunk `origin` and `addedReason` fields, and the
        version history of the breakdown artifact, tell you what changed
        mid-flight and why — use them.
    artifacts:
      - name: conformance-review
        kind: findings
        reviews: progress
    transitions:
      - name: accept
        to: pull-request
        gates:
          - type: artifact-fresh
            config: { artifact: conformance-review, recordedThisCycle: true }
          - type: findings-clear
            config: { artifact: conformance-review, blocking: [critical, high] }
      - name: rework
        to: executing

  - id: pull-request
    description: One pull request for the whole breakdown.
    work:
      mode: interactive
      skills: [pull-request]
      constraints: agent-constraints/implementation-conventions.md
    evidence:
      - name: change-request
        schema:
          type: object
          required: [url, headSha]
          properties:
            url: { type: string, minLength: 1 }
            headSha: { type: string, minLength: 7 }
    transitions:
      - name: ship
        to: done
        gates:
          - type: evidence-recorded
            config: { name: change-request }
          - type: human-approval
            config: { id: ship-approval }
      - name: rework
        to: executing

  - id: done
    terminal: true

  - id: aborted
    terminal: true

globalTransitions:
  - name: abort
    to: aborted
    gates:
      - type: human-approval
        config: { id: abort-confirmation }
