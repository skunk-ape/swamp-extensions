manifestVersion: 1
name: "@skunk-ape/fka"
version: 2026.08.24.5
description: |
  Formerly known as. Wrap a CLI in the permission tier it deserves.

  Take a command-line tool the agent already has, work out which of its commands
  are safe to run unattended, and generate a wrapper that enforces the answer.
  The wrapper is named for the tool and the tier: `gh` becomes `fka-safe-gh`,
  `fka-private-gh`, `fka-write-gh`. The tier moves out of the argument list and
  into the command name, which is the one part of a shell command a permission
  rule can match cheaply and exactly.

  ## The problem

  Claude Code grants Bash permission by prefix match, and for a real command
  tree both answers are bad. `Bash(gh:*)` includes `gh repo delete`. Enumerating
  `Bash(gh pr list:*)` and its forty siblings goes stale on every upgrade and is
  still only a prefix match — it cannot see options, and options are where the
  danger is. `gh api` issues any HTTP verb you ask for. `sort` writes files with
  `-o`. `git log` runs arbitrary code through `--ext-diff`.

  So a generated wrapper is not a namespace. It is a parser that re-reads the
  whole argument vector and refuses anything not explicitly permitted. The
  namespace makes the rule short; the parser makes it true.

  ## Aliases, not just tiers

  The move is to lift a fact out of the argument vector and into a command name.
  Tiers are one use of it; pinning a subcommand or a flag is another. An alias is
  named `fka-<segment>-<tool>`, with the segment from a closed set — `help`,
  `safe`, `private`, `write`, `escape` — so permission rules key on the segment
  and never on the tool:

      "allow": ["Bash(fka-help:*)", "Bash(fka-safe:*)"]
      "ask":   ["Bash(fka-private:*)", "Bash(fka-write:*)"]

  Wrap another CLI tomorrow and that file does not change. `Bash(fka-help:*)` on
  its own is the narrowest useful grant: the agent reads any command's
  documentation and runs none of them.

  Which aliases a tool gets is judgement about that tool, proposed by the
  classifier against guidelines and settled at the review gate. A pinned alias
  builds its own argument vector — `fka-help-git commit` runs `git commit
  --help` because the alias adds the flag — which is a stronger guarantee than
  permitting a flag and checking for it.

  Options are tiered separately from their commands, so `git log` can be
  read-safe while `git log --ext-diff` is not.

  ## Methods

  - `discover` — recursively read `<cli> --help` and record the command tree,
    the option spellings, and each option's arity. Deterministic. Runs the tool
    only with its help flag, through argv rather than a shell, under a depth
    cap, a command cap, and a per-call timeout.
  - `classify` — a model session proposes a tier per command, an option
    allowlist, and an environment scrub list, then writes a commented review
    file. Its output is checked back against the crawl, so it can re-tier what
    discover found but never invent a command or an option.
  - `generate` — read back the edited review file and render the wrappers, the
    permission snippet, and the skill snippet. One method, because they are
    three views of one fact. Each wrapper is written to a neighbouring temp and
    renamed, so a caller invoking one mid-run gets the old policy or the new
    one and never a half-written file. An alias dropped from the review file is
    also removed from `bin/`, because a wrapper left behind keeps enforcing the
    policy it was rendered with while the rule granting its segment still
    matches its name.
  - `remove` — stop wrapping a tool. Takes its wrappers off PATH; with
    `purge` also deletes its review file and crawl. The permission rules key on
    the segment rather than the tool, so unwrapping one tool needs no edit to
    `settings.json` and leaves every other tool's rules correct.
  - `verify` — prove every wrapper permits its own tier and refuses everything
    above it, using a check mode that never executes the wrapped tool. The
    matrix covers argument *syntax* as well as coverage: `--`, attached values,
    short clusters, positionals, and a constrained option exercised with a
    value that cannot match it.

  ## The human gate

  `classify` writes a proposal with `approved: false`, and has no way to write
  anything else. `generate` refuses to render a wrapper until a person has set
  that flag to true, so the gate is a state on disk rather than a convention
  about who runs what in which order. Anything the classifier was unsure of is
  not read-safe, and anything absent from the table is refused.

  Two blocks are worth real attention. `read-safe` is one, because it is the
  only tier that runs unattended. `wrappers` is the other, and it is short: an
  option pinned there applies at every command its alias admits, so it is
  checked against the crawl and against that alias's own ceiling before it can
  be rendered.

  ## Where it lives

  Workspaces go under `$XDG_CONFIG_HOME/fka`, falling back to `~/.config/fka` —
  your home directory, not the repository you were standing in. A wrapper is
  invoked by bare name, so it lives in the machine's namespace: two projects
  wrapping `gh` would each render an executable called `fka-safe-gh`, and only
  one can be on PATH.

  Every wrapper for every tool is written to one shared `bin/`, so putting that
  directory on PATH is a one-time setup that later runs never add to. Each tool
  keeps its `review.yaml` and `surface.json` in its own subdirectory. Set
  `workRoot` to move all of it.

  ## The tested parser is the shipped parser

  The wrapper is TypeScript on Deno so the argument parser can be unit-tested —
  it is the security boundary, and an untested parser guarding an `allow` rule
  is worse than no rule. `generate` pastes `_lib/validate.ts` verbatim into each
  wrapper, so the code that runs on disk is the module the suite exercises and
  only the policy data differs.

  ## What it does not do

  It does not sandbox. A wrapper controls the argument vector and nothing else:
  an allowlisted `git log` still reads `~/.gitconfig`, and a `[diff] external`
  hook there still runs. It does not install its own output — nothing here
  writes `settings.json`. And it does not help against a hostile CLI, since
  `discover` runs the binary to read its help.

  ## Prerequisites

  - swamp initialized in the repository (`swamp repo init`)
  - the CLI you want to wrap, on PATH
  - Claude Code on PATH, for `classify` only
