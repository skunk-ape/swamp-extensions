manifestVersion: 1
name: '@skunk-ape/hermes'
version: 2026.08.20.1
description: |
  Install and configure the Hermes agent (https://hermes-agent.org/) on a Linux
  host, from a declaration rather than an interactive wizard.

  Upstream ships one command: a curl|bash installer that tracks `main`, prompts
  about system packages and PATH edits, asks what to do with an existing
  install, and then runs a setup wizard for API keys. Wrapping that adds
  nothing. This model inverts it — every choice the wizard asks for at runtime
  becomes a field decided once, in version control, before anything touches the
  host. A declarative install is reviewable, re-runnable, and diffable.

  ## Status

  In development. All five methods are implemented against the upstream
  installer's real flags and paths. `preflight` is verified end to end; the
  install path has not yet been run against a Linux host. `DESIGN.md` is the
  design record and is the thing worth reading first.

  ## Methods

  - `preflight` — assert OS and arch, systemd and its user bus, passwordless
    sudo, free space, egress, and the tools the installer assumes. Resolves the
    configured ref against the remote and validates every environment value.
    Changes nothing, so a bad ref or a malformed environment key fails here
    rather than after Chromium has downloaded.
  - `install` — resolve the ref to a commit, fetch the upstream installer at
    that same commit, and drive it non-interactively under a wall-clock cap.
    Idempotent.
  - `configure` — render the Hermes `.env`, whole, at mode 0600, through a
    base64 payload inside a stdin-fed script, so no secret reaches a command
    argument or a local temporary file.
  - `service` — install, enable, and start the systemd user unit for the
    messaging gateway, with lingering so it survives logout and comes back at
    boot.
  - `verify` — confirm Hermes answers, rather than that the installer exited 0.

  ## Two things worth knowing before configuring it

  The gateway is a systemd **user** unit, not a system one, so it needs a user
  bus and it needs lingering to start at boot. `service` handles both, and
  `lima-hermes.yaml` enables lingering at provision time so the VM comes up
  ready.

  There is no messaging-platform list, because upstream has no such switch: the
  gateway enables a platform when it finds that platform's token in the
  environment. Putting the token in `env` is how you turn it on.

  ## Target

  The target is any Linux host, and this model does not create it. Provisioning
  has a separate lifecycle. `lima-hermes.yaml` is a ready template for the
  intended first target: a Lima VM on macOS with no host mounts, passwordless
  sudo, and a swamp worker enrolled on first boot.

  The VM boundary is load-bearing rather than convenient. It is what makes
  granting an autonomous agent passwordless sudo a reasonable trade, and it is
  why the template pins `mounts: []` instead of inheriting a base that mounts
  the host home directory.

  ## Prerequisites

  - A Linux host with systemd, plus `git` and `curl`.
  - Passwordless sudo. Needed for the system packages, and for `loginctl
    enable-linger`. `installSystemPackages: false` avoids the first only when
    ripgrep and ffmpeg are already installed, which `preflight` checks.
  - A vault holding whatever API keys Hermes needs.
repository: 'https://github.com/skunk-ape/swamp-extensions'

# Everything for this extension lives beside this manifest, so typed entries
# and additionalFiles both resolve from here rather than from extensions/models/.
paths:
  base: manifest

models:
  - hermes.ts
workflows: []
vaults: []
drivers: []
datastores: []
reports: []
skills: []
additionalFiles:
  - README.md
  - DESIGN.md
  - lima-hermes.yaml
  - LICENSE
dependencies: []
labels:
  - hermes
  - agent
  - install
  - lima
  - provisioning
